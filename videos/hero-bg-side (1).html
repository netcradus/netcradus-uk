<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<title>3D Animated Background - Side</title>
<style>
  :root{
    --bg1:#0b0518;
    --bg2:#1a0a2e;
    --bg3:#3a0d2e;
    --bg4:#5c1220;
    --pink:#ff2d78;
    --orange:#ff8a1f;
    --white:#e9e4f5;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    width:100%;height:100%;
    background:#050208;
    overflow:hidden;
  }
  .stage{
    position:relative;
    width:100%;
    height:100vh;
    overflow:hidden;
    background:
      radial-gradient(circle at 90% 45%, var(--bg4) 0%, transparent 32%),
      radial-gradient(circle at 94% 20%, var(--bg3) 0%, transparent 40%),
      linear-gradient(115deg, var(--bg1) 0%, var(--bg1) 55%, var(--bg2) 72%, var(--bg3) 88%, var(--bg4) 100%);
  }

  .stars{
    position:absolute; inset:-10%;
    background-image:
      radial-gradient(1.5px 1.5px at 20% 30%, rgba(255,255,255,.85) 50%, transparent 51%),
      radial-gradient(1px 1px at 60% 70%, rgba(255,255,255,.6) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 80% 10%, rgba(255,255,255,.7) 50%, transparent 51%),
      radial-gradient(1px 1px at 30% 80%, rgba(255,255,255,.5) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 50% 50%, rgba(255,255,255,.6) 50%, transparent 51%),
      radial-gradient(1px 1px at 90% 60%, rgba(255,255,255,.7) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 10% 60%, rgba(255,255,255,.5) 50%, transparent 51%),
      radial-gradient(1px 1px at 40% 15%, rgba(255,255,255,.6) 50%, transparent 51%);
    background-size: 600px 600px;
    opacity:.6;
    animation: drift 55s linear infinite;
  }
  @keyframes drift{
    from{ background-position: 0 0; }
    to{ background-position: -600px 300px; }
  }

  /* tunnel pinned to the right side only, left stays blank */
  .tunnelWrap{
    position:absolute;
    top:50%; right:2%;
    width:380px; height:380px;
    transform: translateY(-50%);
    animation: breathe 14s ease-in-out infinite;
  }
  @keyframes breathe{
    0%,100%{ transform: translateY(-50%) scale(1); }
    50%{ transform: translateY(-50%) scale(1.06); }
  }
  .tunnel{
    position:absolute; inset:0;
    transform: perspective(900px) rotateY(32deg) rotateX(6deg);
    transform-style:preserve-3d;
    animation: tilt 22s ease-in-out infinite;
  }
  @keyframes tilt{
    0%,100%{ transform: perspective(900px) rotateY(32deg) rotateX(6deg); }
    50%{ transform: perspective(900px) rotateY(22deg) rotateX(1deg); }
  }
  .ring{
    position:absolute;
    top:50%; left:50%;
    border-radius:50%;
    border:1.2px solid;
    transform: translate(-50%,-50%);
    animation: spin linear infinite;
    opacity:.85;
  }
  .ring.rev{ animation-direction:reverse; }

  @keyframes spin{
    from{ transform: translate(-50%,-50%) rotateZ(0deg); }
    to{ transform: translate(-50%,-50%) rotateZ(360deg); }
  }

  .r1{ width:55px; height:55px; border-color:var(--white); animation-duration:18s;}
  .r2{ width:95px; height:95px; border-color:var(--pink); animation-duration:24s;}
  .r3{ width:135px; height:135px; border-color:var(--orange); animation-duration:30s;}
  .r4{ width:175px; height:175px; border-color:var(--pink); animation-duration:36s;}
  .r5{ width:215px; height:215px; border-color:var(--white); opacity:.55; animation-duration:42s;}
  .r6{ width:255px; height:255px; border-color:var(--orange); opacity:.5; animation-duration:48s;}
  .r7{ width:295px; height:295px; border-color:var(--pink); opacity:.4; animation-duration:54s;}
  .r8{ width:335px; height:335px; border-color:var(--orange); opacity:.28; animation-duration:60s;}
  .r9{ width:375px; height:375px; border-color:var(--white); opacity:.18; animation-duration:66s;}

  .glowCore{
    position:absolute; top:50%; right:18%;
    width:75px; height:75px;
    transform:translateY(-50%);
    background:radial-gradient(circle, rgba(255,255,255,.9) 0%, rgba(255,138,31,.5) 35%, transparent 70%);
    filter:blur(10px);
    animation: pulse 6s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes pulse{
    0%,100%{ opacity:.7; }
    50%{ opacity:1; }
  }

  .glow{
    position:absolute; top:50%; right:0%;
    width:320px; height:320px;
    transform:translateY(-50%);
    background:radial-gradient(circle, rgba(255,45,120,.28) 0%, rgba(255,138,31,.12) 45%, transparent 70%);
    filter:blur(14px);
    pointer-events:none;
  }

  .particle{
    position:absolute;
    border-radius:50%;
    background:#fff;
    opacity:.6;
    animation: floatUp linear infinite;
  }
  @keyframes floatUp{
    from{ transform: translateY(0) scale(1); opacity:.6; }
    to{ transform: translateY(-120vh) scale(.4); opacity:0; }
  }

  .vignette{
    position:absolute; inset:0;
    background:radial-gradient(ellipse at 88% 50%, rgba(5,2,8,0) 22%, rgba(5,2,8,.55) 100%);
    pointer-events:none;
  }
</style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="stars"></div>
    <div class="glow"></div>

    <div class="tunnelWrap">
      <div class="tunnel">
        <div class="ring r1"></div>
        <div class="ring r2 rev"></div>
        <div class="ring r3"></div>
        <div class="ring r4 rev"></div>
        <div class="ring r5"></div>
        <div class="ring r6 rev"></div>
        <div class="ring r7"></div>
        <div class="ring r8 rev"></div>
        <div class="ring r9"></div>
      </div>
    </div>
    <div class="glowCore"></div>

    <div class="vignette"></div>
  </div>

<script>
  const stage = document.getElementById('stage');
  const count = 25;
  for(let i=0;i<count;i++){
    const p = document.createElement('div');
    p.className = 'particle';
    const size = Math.random()*2.5 + 1;
    p.style.width = size+'px';
    p.style.height = size+'px';
    p.style.left = (78 + Math.random()*22)+'%';
    p.style.top = (100 + Math.random()*20)+'%';
    const dur = 8 + Math.random()*14;
    p.style.animationDuration = dur+'s';
    p.style.animationDelay = (-Math.random()*dur)+'s';
    stage.appendChild(p);
  }
</script>
</body>
</html>
