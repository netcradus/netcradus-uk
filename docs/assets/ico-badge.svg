      <stop offset="100%" stop-color="#051f38" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff8a1f" />
      <stop offset="100%" stop-color="#ff2d78" />
    </linearGradient>
  </defs>
