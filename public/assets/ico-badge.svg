<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="icoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070b14" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7a00" />
      <stop offset="100%" stop-color="#ff2d78" />
    </linearGradient>
  </defs>

  <!-- Outer Badge Ring with Gradient Border -->
  <circle cx="100" cy="100" r="94" fill="url(#icoGrad)" stroke="url(#goldGrad)" stroke-width="4.5"/>
  <circle cx="100" cy="100" r="86" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- Official "ico." Typography -->
  <text x="100" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-1">ico.</text>

  <!-- "Information Commissioner's Office" Text -->
  <text x="100" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#94a3b8" text-anchor="middle" letter-spacing="0.3">Information Commissioner's Office</text>

  <!-- Divider Line -->
  <line x1="45" y1="116" x2="155" y2="116" stroke="rgba(255,122,0,0.4)" stroke-width="1"/>

  <!-- Shield Icon Emblem -->
  <path d="M100 124 L116 133 C116 150 100 160 100 160 C100 160 84 150 84 133 Z" fill="url(#goldGrad)"/>
  <path d="M96 141 L99 144 L105 137" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Registration Ref -->
  <text x="100" y="178" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="800" fill="#ff7a00" text-anchor="middle" letter-spacing="0.5">REF: ZC045097</text>
</svg>
